          import android.hardware.camera2.params.StreamConfigurationMap;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.Surface;
          import android.view.TextureView;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.FileWriter;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          
          public class MainActivity extends Activity implements SensorEventListener {
              private static final int REQ_CAMERA = 2407;
              private static final int BG = Color.rgb(5, 9, 20);
              private static final int CARD = Color.argb(226, 17, 27, 52);
              private static final int CARD_2 = Color.argb(230, 9, 17, 35);
              private static final int TEXT = Color.rgb(235, 243, 255);
              private static final int MUTED = Color.rgb(150, 166, 194);
              private static final int CYAN = Color.rgb(57, 220, 255);
              private static final int GREEN = Color.rgb(51, 255, 152);
              private static final int AMBER = Color.rgb(255, 193, 84);
              private static final int RED = Color.rgb(255, 82, 108);
          
              private SensorManager sensorManager;
              private Sensor accelerometer;
              private TextView longText, transText, percentLongText, percentTransText, statusText, errorText, savedText, sensorText, modeText;
              private EditText projectInput, techInput, refInput, targetLongInput, targetTransInput, toleranceInput;
              private Button cameraButton;
              private ProLevelView levelView;
              private TextureView cameraView;
              private FrameLayout rootFrame;
          
              private final float[] gravity = new float[]{0f, 0f, 0f};
              private double longitudinal = 0.0;
              private double transversal = 0.0;
              private double zeroLong = 0.0;
              private double zeroTrans = 0.0;
              private boolean hasValue = false;
              private long lastVibration = 0;
              private long lastUiUpdate = 0;
              private int eventCount = 0;
          
              private CameraDevice cameraDevice;
              private CameraCaptureSession cameraSession;
              private CaptureRequest.Builder previewBuilder;
              private HandlerThread cameraThread;
              private Handler cameraHandler;
              private boolean cameraEnabled = false;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
          
                  sensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                  accelerometer = sensorManager == null ? null : sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
          
                  rootFrame = new FrameLayout(this);
                  rootFrame.setBackgroundColor(BG);
          
                  cameraView = new TextureView(this);
                  cameraView.setAlpha(0.72f);
                  cameraView.setVisibility(View.GONE);
                  rootFrame.addView(cameraView, new FrameLayout.LayoutParams(-1, -1));
          
                  View shade = new View(this);
                  GradientDrawable shadeBg = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{Color.argb(210, 5, 9, 20), Color.argb(110, 5, 9, 20), Color.argb(230, 5, 9, 20)});
                  shade.setBackground(shadeBg);
                  rootFrame.addView(shade, new FrameLayout.LayoutParams(-1, -1));
          
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setPadding(0, 0, 0, 0);
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(50), dp(16), dp(24));
                  scroll.addView(root, new ScrollView.LayoutParams(-1, -2));
                  rootFrame.addView(scroll, new FrameLayout.LayoutParams(-1, -1));
          
                  TextView title = new TextView(this);
                  title.setText("NIVEL FV PRO");
                  title.setTextColor(TEXT);
                  title.setTextSize(32);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setLetterSpacing(0.10f);
                  root.addView(title, lp(-1, -2, 0, 0, 0, 2));
          
                  TextView subtitle = new TextView(this);
                  subtitle.setText("solar tools · longitudinal + transversal · cámara · informe");
                  subtitle.setTextColor(CYAN);
                  subtitle.setTextSize(13);
                  subtitle.setGravity(Gravity.CENTER);
                  root.addView(subtitle, lp(-1, -2, 0, 0, 0, 4));
          
                  TextView byDakone = new TextView(this);
                  byDakone.setText("Realizado por DaKoNe");
                  byDakone.setTextColor(Color.rgb(188, 245, 255));
                  byDakone.setTextSize(13);
                  byDakone.setGravity(Gravity.CENTER);
                  byDakone.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(byDakone, lp(-1, -2, 0, 0, 0, 12));
          
                  LinearLayout statusCard = card();
                  statusText = new TextView(this);
                  statusText.setText("ESPERANDO SENSOR");
                  statusText.setTextSize(22);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setTypeface(Typeface.DEFAULT_BOLD);
                  statusText.setTextColor(AMBER);
                  statusCard.addView(statusText, lp(-1, -2, 0, 0, 0, 5));
          
                  errorText = new TextView(this);
                  errorText.setText("desviación: --°");
                  errorText.setTextSize(14);
                  errorText.setTextColor(MUTED);
                  errorText.setGravity(Gravity.CENTER);
                  statusCard.addView(errorText);
                  root.addView(statusCard, lp(-1, -2, 0, 0, 0, 10));
          
                  levelView = new ProLevelView(this);
                  root.addView(levelView, lp(-1, dp(265), 0, 0, 0, 10));
          
                  LinearLayout grid = new LinearLayout(this);
                  grid.setOrientation(LinearLayout.HORIZONTAL);
                  grid.setBaselineAligned(false);
                  LinearLayout longCard = metricCard("LONGITUDINAL");
                  longText = valueText("--°");
                  percentLongText = smallCenter("-- % pendiente");
                  longCard.addView(longText);
                  longCard.addView(percentLongText);
                  LinearLayout transCard = metricCard("TRANSVERSAL");
                  transText = valueText("--°");
                  percentTransText = smallCenter("-- % pendiente");
                  transCard.addView(transText);
                  transCard.addView(percentTransText);
                  grid.addView(longCard, weightLp(1f, 0, 0, 5, 0));
                  grid.addView(transCard, weightLp(1f, 5, 0, 0, 0));
                  root.addView(grid, lp(-1, -2, 0, 0, 0, 10));
          
                  LinearLayout form = card();
                  projectInput = input("Parque / proyecto", false);
                  techInput = input("Técnico", false);
                  refInput = input("CT / inversor / tracker / mesa", false);
                  targetLongInput = input("Objetivo L", true);
                  targetTransInput = input("Objetivo T", true);
                  toleranceInput = input("Tol.", true);
                  targetLongInput.setText("0");
                  targetTransInput.setText("0");
                  toleranceInput.setText("1");
                  techInput.setText("DaKoNe");
                  form.addView(label("Datos de campo"));
                  form.addView(projectInput, lp(-1, -2, 0, 0, 0, 6));
                  LinearLayout rowTop = new LinearLayout(this);
                  rowTop.setOrientation(LinearLayout.HORIZONTAL);
                  rowTop.addView(techInput, weightLp(1f, 0, 0, 5, 0));
                  rowTop.addView(refInput, weightLp(1f, 5, 0, 0, 0));
                  form.addView(rowTop, lp(-1, -2, 0, 0, 0, 8));
                  form.addView(label("Objetivo y tolerancia en grados"));
                  LinearLayout rowObj = new LinearLayout(this);
                  rowObj.setOrientation(LinearLayout.HORIZONTAL);
                  rowObj.addView(targetLongInput, weightLp(1f, 0, 0, 4, 0));
                  rowObj.addView(targetTransInput, weightLp(1f, 4, 0, 4, 0));
                  rowObj.addView(toleranceInput, weightLp(0.75f, 4, 0, 0, 0));
                  form.addView(rowObj);
                  root.addView(form, lp(-1, -2, 0, 0, 0, 10));
          
                  LinearLayout buttons1 = new LinearLayout(this);
                  buttons1.setOrientation(LinearLayout.HORIZONTAL);
                  Button calibrate = button("Calibrar cero", CYAN, Color.argb(230, 0, 28, 42));
                  Button reset = button("Reset", MUTED, Color.argb(230, 29, 37, 58));
                  buttons1.addView(calibrate, weightLp(1f, 0, 0, 5, 0));
                  buttons1.addView(reset, weightLp(1f, 5, 0, 0, 0));
                  root.addView(buttons1, lp(-1, -2, 0, 0, 0, 8));
          
                  LinearLayout buttons2 = new LinearLayout(this);
                  buttons2.setOrientation(LinearLayout.HORIZONTAL);
                  cameraButton = button("Cámara OFF", CYAN, Color.argb(230, 0, 28, 42));
                  Button capture = button("Captura PNG", GREEN, Color.argb(230, 0, 45, 30));
                  buttons2.addView(cameraButton, weightLp(1f, 0, 0, 5, 0));
                  buttons2.addView(capture, weightLp(1f, 5, 0, 0, 0));
                  root.addView(buttons2, lp(-1, -2, 0, 0, 0, 8));
          
                  Button save = button("Guardar medida CSV", GREEN, Color.argb(230, 0, 45, 30));
                  root.addView(save, lp(-1, -2, 0, 0, 0, 10));
          
                  LinearLayout diag = card();
                  modeText = small("modo: profesional de prueba · v1.0-pro-test");
                  sensorText = small("sensor: " + (accelerometer == null ? "NO DISPONIBLE" : accelerometer.getName()));
                  savedText = small("sin mediciones guardadas todavía");
                  diag.addView(modeText);
                  diag.addView(sensorText);
                  diag.addView(savedText);
                  root.addView(diag);
          
                  calibrate.setOnClickListener(v -> {
                      if (!hasValue) {
                          toast("Todavía no hay lectura");
                          return;
                      }
                      zeroLong = longitudinal;
                      zeroTrans = transversal;
                      toast("Cero calibrado");
                      updateDisplay();
                  });
          
                  reset.setOnClickListener(v -> {
                      zeroLong = 0.0;
                      zeroTrans = 0.0;
                      toast("Cero reiniciado");
                      updateDisplay();
                  });
          
                  save.setOnClickListener(v -> saveMeasurement());
                  capture.setOnClickListener(v -> saveReportPng());
                  cameraButton.setOnClickListener(v -> toggleCamera());
          
                  loadPrefs();
                  setContentView(rootFrame);
          
                  if (accelerometer == null) {
                      statusText.setText("SIN ACELERÓMETRO");
                      statusText.setTextColor(RED);
                      errorText.setText("Este móvil no entrega sensor de inclinación.");
                  }
              }
          
              @Override
              protected void onResume() {
                  super.onResume();
                  try {
                      if (sensorManager != null && accelerometer != null) {
                          sensorManager.registerListener(this, accelerometer, SensorManager.SENSOR_DELAY_GAME);
                      }
                  } catch (Exception e) {
                      showSensorError(e);
                  }
                  if (cameraEnabled) startCamera();
              }
          
              @Override
              protected void onPause() {
                  super.onPause();
                  savePrefs();
                  try {
                      if (sensorManager != null) sensorManager.unregisterListener(this);
                  } catch (Exception ignored) {}
                  stopCamera();
              }
          
              @Override
              public void onSensorChanged(SensorEvent event) {
                  try {
                      if (event == null || event.sensor == null || event.values == null) return;
                      if (event.sensor.getType() != Sensor.TYPE_ACCELEROMETER) return;
                      if (event.values.length < 3) return;
          
                      final float alpha = 0.86f;
                      gravity[0] = alpha * gravity[0] + (1f - alpha) * event.values[0];
                      gravity[1] = alpha * gravity[1] + (1f - alpha) * event.values[1];
                      gravity[2] = alpha * gravity[2] + (1f - alpha) * event.values[2];
          
                      double x = gravity[0];
                      double y = gravity[1];
                      double z = gravity[2];
          
                      // Móvil en vertical. Ejes pensados para uso real en estructura/tracker:
                      // longitudinal = inclinación arriba/abajo, transversal = izquierda/derecha.
                      longitudinal = Math.toDegrees(Math.atan2(-x, Math.sqrt(y * y + z * z)));
                      transversal = Math.toDegrees(Math.atan2(y, z));
                      hasValue = true;
                      eventCount++;
          
                      long now = System.currentTimeMillis();
                      if (now - lastUiUpdate > 55) {
                          lastUiUpdate = now;
                          updateDisplay();
                      }
                  } catch (Exception e) {
                      showSensorError(e);
                  }
              }
          
              private void updateDisplay() {
                  try {
                      double relLong = longitudinal - zeroLong;
                      double relTrans = transversal - zeroTrans;
                      double targetLong = parseDouble(targetLongInput.getText().toString(), 0.0);
                      double targetTrans = parseDouble(targetTransInput.getText().toString(), 0.0);
                      double tolerance = Math.abs(parseDouble(toleranceInput.getText().toString(), 1.0));
                      if (tolerance < 0.05) tolerance = 0.05;
          
                      double errLongSigned = relLong - targetLong;
                      double errTransSigned = relTrans - targetTrans;
                      double errLong = Math.abs(errLongSigned);
                      double errTrans = Math.abs(errTransSigned);
                      double error = Math.max(errLong, errTrans);
                      String status = statusFor(error, tolerance);
          
                      longText.setText(fmt(relLong));
                      transText.setText(fmt(relTrans));
                      percentLongText.setText(String.format(Locale.US, "%+.1f %% pendiente", slopePercent(relLong)));
                      percentTransText.setText(String.format(Locale.US, "%+.1f %% pendiente", slopePercent(relTrans)));
                      errorText.setText(String.format(Locale.US, "desv. L %.2f° · T %.2f° · máx %.2f° · tol %.2f° · %d lecturas", errLong, errTrans, error, tolerance, eventCount));
                      sensorText.setText("sensor: " + (accelerometer == null ? "NO" : accelerometer.getName()) + " · cero " + fmt(zeroLong) + " / " + fmt(zeroTrans));
                      levelView.setValues(errLongSigned, errTransSigned, tolerance, relLong, relTrans, targetLong, targetTrans);
          
                      if ("OK".equals(status)) {
                          statusText.setText("OK · CLAVADO");
                          statusText.setTextColor(GREEN);
                          safeVibrate();
                      } else if ("REVISAR".equals(status)) {
                          statusText.setText("REVISAR · CERCA");
                          statusText.setTextColor(AMBER);
                      } else {
                          statusText.setText("FUERA · AJUSTAR");
                          statusText.setTextColor(RED);
                      }
                  } catch (Exception e) {
                      showSensorError(e);
                  }
              }
          
              private void saveMeasurement() {
                  if (!hasValue) {
                      toast("Todavía no hay lectura de sensor");
                      return;
                  }
                  try {
                      Measurement m = currentMeasurement();
                      File dir = getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS);
                      if (dir == null) dir = getFilesDir();
                      if (!dir.exists()) dir.mkdirs();
                      File file = new File(dir, "nivel_fv_pro_mediciones.csv");
                      boolean newFile = !file.exists();
                      FileWriter writer = new FileWriter(file, true);
                      if (newFile) {
                          writer.append("fecha,proyecto,tecnico,referencia,longitudinal_deg,transversal_deg,pendiente_longitudinal_pct,pendiente_transversal_pct,objetivo_longitudinal_deg,objetivo_transversal_deg,tolerancia_deg,error_longitudinal_deg,error_transversal_deg,error_max_deg,estado,zero_longitudinal,zero_transversal\n");
                      }
                      writer.append(csv(m.date)).append(',')
                              .append(csv(m.project)).append(',')
                              .append(csv(m.tech)).append(',')
                              .append(csv(m.ref)).append(',')
                              .append(num(m.relLong)).append(',')
                              .append(num(m.relTrans)).append(',')
                              .append(num(m.slopeLong)).append(',')
                              .append(num(m.slopeTrans)).append(',')
                              .append(num(m.targetLong)).append(',')
                              .append(num(m.targetTrans)).append(',')
                              .append(num(m.tolerance)).append(',')
                              .append(num(m.errLong)).append(',')
                              .append(num(m.errTrans)).append(',')
                              .append(num(m.errMax)).append(',')
                              .append(csv(m.status)).append(',')
                              .append(num(zeroLong)).append(',')
                              .append(num(zeroTrans)).append('\n');
                      writer.close();
                      savedText.setText("CSV: " + file.getAbsolutePath());
                      toast("Medida guardada");
                  } catch (Exception e) {
                      savedText.setText("Error guardando CSV: " + e.getClass().getSimpleName());
                      Toast.makeText(this, "Error guardando: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          
              private void saveReportPng() {
                  if (!hasValue) {
                      toast("Todavía no hay lectura de sensor");
                      return;
                  }
                  try {
                      Measurement m = currentMeasurement();
                      File dir = getExternalFilesDir(Environment.DIRECTORY_PICTURES);
                      if (dir == null) dir = getFilesDir();
                      if (!dir.exists()) dir.mkdirs();
                      String safeRef = m.ref.replaceAll("[^A-Za-z0-9_-]", "_");
                      if (safeRef.length() == 0) safeRef = "medida";
                      File file = new File(dir, "NivelFV_PRO_" + safeRef + "_" + new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) + ".png");
          
                      Bitmap bitmap = Bitmap.createBitmap(1440, 1920, Bitmap.Config.ARGB_8888);
                      Canvas canvas = new Canvas(bitmap);
                      drawReport(canvas, bitmap.getWidth(), bitmap.getHeight(), m);
                      FileOutputStream out = new FileOutputStream(file);
                      bitmap.compress(Bitmap.CompressFormat.PNG, 100, out);
                      out.flush();
                      out.close();
                      bitmap.recycle();
                      savedText.setText("PNG: " + file.getAbsolutePath());
                      toast("Captura PNG guardada");
                  } catch (Exception e) {
                      savedText.setText("Error PNG: " + e.getClass().getSimpleName());
                      Toast.makeText(this, "Error PNG: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          
              private Measurement currentMeasurement() {
                  Measurement m = new Measurement();
                  m.date = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(new Date());
                  m.project = textOr(projectInput, "sin_proyecto");
                  m.tech = textOr(techInput, "DaKoNe");
                  m.ref = textOr(refInput, "sin_referencia");
                  m.relLong = longitudinal - zeroLong;
                  m.relTrans = transversal - zeroTrans;
                  m.targetLong = parseDouble(targetLongInput.getText().toString(), 0.0);
                  m.targetTrans = parseDouble(targetTransInput.getText().toString(), 0.0);
                  m.tolerance = Math.abs(parseDouble(toleranceInput.getText().toString(), 1.0));
                  if (m.tolerance < 0.05) m.tolerance = 0.05;
                  m.errLong = Math.abs(m.relLong - m.targetLong);
                  m.errTrans = Math.abs(m.relTrans - m.targetTrans);
                  m.errMax = Math.max(m.errLong, m.errTrans);
                  m.slopeLong = slopePercent(m.relLong);
                  m.slopeTrans = slopePercent(m.relTrans);
                  m.status = statusFor(m.errMax, m.tolerance);
                  return m;
              }
          
              private void drawReport(Canvas c, int w, int h, Measurement m) {
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(BG);
                  c.drawRect(0, 0, w, h, p);
          
                  GradientDrawable bg = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{Color.rgb(8, 16, 34), Color.rgb(3, 7, 16)});
                  bg.setBounds(0, 0, w, h);
                  bg.draw(c);
          
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setColor(TEXT);
                  p.setTextSize(74f);
                  c.drawText("NIVEL FV PRO", w / 2f, 130f, p);
                  p.setTextSize(30f);
                  p.setColor(CYAN);
                  c.drawText("Realizado por DaKoNe · informe de medición", w / 2f, 180f, p);
          
                  int statusColor = "OK".equals(m.status) ? GREEN : ("REVISAR".equals(m.status) ? AMBER : RED);
                  p.setColor(statusColor);
                  p.setTextSize(78f);
                  c.drawText(m.status, w / 2f, 300f, p);
          
                  drawReportCard(c, p, 90, 360, w - 90, 760, "LECTURA", new String[]{
                          "Longitudinal: " + fmt(m.relLong) + "   (" + String.format(Locale.US, "%+.1f%%", m.slopeLong) + ")",
                          "Transversal:  " + fmt(m.relTrans) + "   (" + String.format(Locale.US, "%+.1f%%", m.slopeTrans) + ")",
                          "Objetivo L/T: " + fmt(m.targetLong) + " / " + fmt(m.targetTrans),
                          "Tolerancia:   ±" + String.format(Locale.US, "%.2f°", m.tolerance),
                          "Error máx.:   " + String.format(Locale.US, "%.2f°", m.errMax)
                  }, statusColor);
          
                  drawReportCard(c, p, 90, 820, w - 90, 1170, "DATOS DE CAMPO", new String[]{
                          "Proyecto:   " + m.project,
                          "Técnico:    " + m.tech,
                          "Referencia: " + m.ref,
                          "Fecha:      " + m.date
                  }, CYAN);
          
                  drawMiniTarget(c, p, w / 2f, 1410f, 210f, m);
          
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTypeface(Typeface.DEFAULT);
                  p.setColor(MUTED);
                  p.setTextSize(28f);
                  c.drawText("CSV + PNG generados localmente en el móvil. La app no sube datos.", w / 2f, h - 105f, p);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  p.setColor(Color.rgb(185, 245, 255));
                  c.drawText("DaKoNe Solar Tools", w / 2f, h - 55f, p);
              }
          
              private void drawReportCard(Canvas c, Paint p, int left, int top, int right, int bottom, String title, String[] lines, int accent) {
                  RectF r = new RectF(left, top, right, bottom);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(Color.argb(230, 17, 27, 52));
                  c.drawRoundRect(r, 34f, 34f, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(4f);
                  p.setColor(Color.argb(170, Color.red(accent), Color.green(accent), Color.blue(accent)));
                  c.drawRoundRect(r, 34f, 34f, p);
                  p.setStyle(Paint.Style.FILL);
                  p.setTextAlign(Paint.Align.LEFT);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  p.setTextSize(36f);
                  p.setColor(accent);
                  c.drawText(title, left + 42f, top + 68f, p);
                  p.setTypeface(Typeface.MONOSPACE);
                  p.setTextSize(34f);
                  p.setColor(TEXT);
                  float y = top + 138f;
                  for (String line : lines) {
                      c.drawText(line, left + 42f, y, p);
                      y += 58f;
                  }
              }
          
              private void drawMiniTarget(Canvas c, Paint p, float cx, float cy, float radius, Measurement m) {
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(4f);
                  p.setColor(Color.argb(110, 57, 220, 255));
                  c.drawCircle(cx, cy, radius, p);
                  c.drawCircle(cx, cy, radius * 0.66f, p);
                  c.drawCircle(cx, cy, radius * 0.33f, p);
                  c.drawLine(cx - radius, cy, cx + radius, cy, p);
                  c.drawLine(cx, cy - radius, cx, cy + radius, p);
                  float scale = radius / 15f;
                  float bx = clamp(cx + (float) (m.relLong - m.targetLong) * scale, cx - radius, cx + radius);
                  float by = clamp(cy - (float) (m.relTrans - m.targetTrans) * scale, cy - radius, cy + radius);
                  int color = "OK".equals(m.status) ? GREEN : ("REVISAR".equals(m.status) ? AMBER : RED);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(Color.argb(80, Color.red(color), Color.green(color), Color.blue(color)));
                  c.drawCircle(bx, by, 58f, p);
                  p.setColor(color);
                  c.drawCircle(bx, by, 34f, p);
                  p.setTextAlign(Paint.Align.CENTER);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  p.setTextSize(32f);
                  p.setColor(TEXT);
                  c.drawText("objetivo X/Y", cx, cy + radius + 68f, p);
              }
          
              private void toggleCamera() {
                  if (cameraEnabled) {
                      cameraEnabled = false;
                      stopCamera();
                      cameraView.setVisibility(View.GONE);
                      cameraButton.setText("Cámara OFF");
                      modeText.setText("modo: sin cámara · medición directa");
                      return;
                  }
                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA);
                      return;
                  }
                  cameraEnabled = true;
                  cameraView.setVisibility(View.VISIBLE);
                  cameraButton.setText("Cámara ON");
                  modeText.setText("modo: cámara activa · referencia visual");
                  startCamera();
              }
          
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_CAMERA) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          cameraEnabled = true;
                          cameraView.setVisibility(View.VISIBLE);
                          cameraButton.setText("Cámara ON");
                          modeText.setText("modo: cámara activa · referencia visual");
                          startCamera();
                      } else {
                          toast("Permiso de cámara denegado");
                      }
                  }
              }
          
              private void startCamera() {
                  try {
                      if (!cameraEnabled) return;
                      if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) return;
                      startCameraThread();
                      if (cameraView.isAvailable()) {
                          openCamera();
                      } else {
                          cameraView.setSurfaceTextureListener(new TextureView.SurfaceTextureListener() {
                              @Override public void onSurfaceTextureAvailable(SurfaceTexture surface, int width, int height) { openCamera(); }
                              @Override public void onSurfaceTextureSizeChanged(SurfaceTexture surface, int width, int height) {}
                              @Override public boolean onSurfaceTextureDestroyed(SurfaceTexture surface) { return true; }
                              @Override public void onSurfaceTextureUpdated(SurfaceTexture surface) {}
                          });
                      }
                  } catch (Exception e) {
                      modeText.setText("cámara: " + e.getClass().getSimpleName());
                  }
              }
          
              private void startCameraThread() {
                  if (cameraThread != null) return;
                  cameraThread = new HandlerThread("NivelFVProCamera");
                  cameraThread.start();
                  cameraHandler = new Handler(cameraThread.getLooper());
              }
          
              private void stopCameraThread() {
                  try {
                      if (cameraThread != null) {
                          cameraThread.quitSafely();
                          cameraThread.join(600);
                      }
                  } catch (Exception ignored) {}
                  cameraThread = null;
                  cameraHandler = null;
              }
          
              private void openCamera() {
                  try {
                      if (cameraDevice != null) return;
                      CameraManager manager = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                      if (manager == null) return;
                      String cameraId = chooseCamera(manager);
                      if (cameraId == null) {
                          modeText.setText("cámara: no disponible");
                          return;
                      }
                      if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) return;
                      manager.openCamera(cameraId, new CameraDevice.StateCallback() {
                          @Override public void onOpened(CameraDevice camera) {
                              cameraDevice = camera;
                              createCameraPreview();
                          }
                          @Override public void onDisconnected(CameraDevice camera) {
                              try { camera.close(); } catch (Exception ignored) {}
                              cameraDevice = null;
                          }
                          @Override public void onError(CameraDevice camera, int error) {
                              try { camera.close(); } catch (Exception ignored) {}
                              cameraDevice = null;
                              runOnUiThread(() -> modeText.setText("cámara: error " + error));
                          }
                      }, cameraHandler);
                  } catch (Exception e) {
                      modeText.setText("cámara: " + e.getClass().getSimpleName());
                  }
              }
          
              private String chooseCamera(CameraManager manager) throws CameraAccessException {
                  String fallback = null;
                  for (String id : manager.getCameraIdList()) {
                      if (fallback == null) fallback = id;
                      CameraCharacteristics c = manager.getCameraCharacteristics(id);
                      Integer facing = c.get(CameraCharacteristics.LENS_FACING);
                      if (facing != null && facing == CameraCharacteristics.LENS_FACING_BACK) return id;
                  }
                  return fallback;
              }
          
              private void createCameraPreview() {
                  try {
                      if (cameraDevice == null || !cameraView.isAvailable()) return;
                      SurfaceTexture texture = cameraView.getSurfaceTexture();
                      if (texture == null) return;
                      texture.setDefaultBufferSize(1280, 720);
                      Surface surface = new Surface(texture);
                      previewBuilder = cameraDevice.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW);
                      previewBuilder.addTarget(surface);
                      cameraDevice.createCaptureSession(Collections.singletonList(surface), new CameraCaptureSession.StateCallback() {
                          @Override public void onConfigured(CameraCaptureSession session) {
                              cameraSession = session;
                              try {
                                  previewBuilder.set(CaptureRequest.CONTROL_AF_MODE, CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_PICTURE);
                                  previewBuilder.set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON);
                                  session.setRepeatingRequest(previewBuilder.build(), null, cameraHandler);
                              } catch (Exception e) {
                                  runOnUiThread(() -> modeText.setText("cámara preview: " + e.getClass().getSimpleName()));
                              }
                          }
                          @Override public void onConfigureFailed(CameraCaptureSession session) {
                              runOnUiThread(() -> modeText.setText("cámara: configuración fallida"));
                          }
                      }, cameraHandler);
                  } catch (Exception e) {
                      modeText.setText("cámara preview: " + e.getClass().getSimpleName());
                  }
              }
          
              private void stopCamera() {
                  try {
                      if (cameraSession != null) {
                          cameraSession.stopRepeating();
                          cameraSession.close();
                      }
                  } catch (Exception ignored) {}
                  cameraSession = null;
                  try {
                      if (cameraDevice != null) cameraDevice.close();
                  } catch (Exception ignored) {}
                  cameraDevice = null;
                  stopCameraThread();
              }
          
              private void savePrefs() {
