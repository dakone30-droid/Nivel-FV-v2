              private static class Measurement {
                  String date;
                  String project;
                  String tech;
                  String ref;
                  String status;
                  double relLong;
                  double relTrans;
                  double targetLong;
                  double targetTrans;
                  double tolerance;
                  double errLong;
                  double errTrans;
                  double errMax;
                  double slopeLong;
                  double slopeTrans;
              }
          
              public static class ProLevelView extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private double errorLong = 0.0;
                  private double errorTrans = 0.0;
                  private double tolerance = 1.0;
                  private double relLong = 0.0;
                  private double relTrans = 0.0;
                  private double targetLong = 0.0;
                  private double targetTrans = 0.0;
                  private double displayLong = 0.0;
                  private double displayTrans = 0.0;
          
                  public ProLevelView(Context context) {
                      super(context);
                      setBackground(makeBg(context));
                  }
          
                  private static GradientDrawable makeBg(Context context) {
                      GradientDrawable bg = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                              new int[]{Color.argb(230, 12, 21, 43), Color.argb(235, 5, 10, 22)});
                      bg.setCornerRadius((int) (24 * context.getResources().getDisplayMetrics().density));
                      bg.setStroke((int) (1 * context.getResources().getDisplayMetrics().density), Color.argb(115, 57, 220, 255));
                      return bg;
                  }
          
                  public void setValues(double errorLong, double errorTrans, double tolerance, double relLong, double relTrans, double targetLong, double targetTrans) {
                      this.errorLong = errorLong;
                      this.errorTrans = errorTrans;
                      this.tolerance = Math.max(0.05, tolerance);
                      this.relLong = relLong;
                      this.relTrans = relTrans;
                      this.targetLong = targetLong;
                      this.targetTrans = targetTrans;
                      displayLong = displayLong * 0.32 + errorLong * 0.68;
                      displayTrans = displayTrans * 0.32 + errorTrans * 0.68;
                      invalidate();
                  }
          
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      float cx = w / 2f;
                      float cy = h * 0.48f;
                      float radius = Math.min(w, h) * 0.34f;
          
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(2f);
                      paint.setColor(Color.argb(78, 57, 220, 255));
                      canvas.drawCircle(cx, cy, radius, paint);
                      canvas.drawCircle(cx, cy, radius * 0.67f, paint);
                      canvas.drawCircle(cx, cy, radius * 0.34f, paint);
                      canvas.drawLine(cx - radius, cy, cx + radius, cy, paint);
                      canvas.drawLine(cx, cy - radius, cx, cy + radius, paint);
          
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(Color.argb(20, 57, 220, 255));
                      canvas.drawOval(new RectF(cx - radius, cy - radius, cx + radius, cy + radius), paint);
          
                      // Rango visual de error: ±15° para ajuste fino. Si te pasas, la bola se queda en el borde.
                      float scale = radius / 15f;
                      float bx = clamp(cx + (float) displayLong * scale, cx - radius, cx + radius);
                      float by = clamp(cy - (float) displayTrans * scale, cy - radius, cy + radius);
                      double errMax = Math.max(Math.abs(errorLong), Math.abs(errorTrans));
                      int color = errMax <= tolerance ? Color.rgb(51, 255, 152) : (errMax <= tolerance * 2.0 ? Color.rgb(255, 193, 84) : Color.rgb(255, 82, 108));
          
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(4f);
                      paint.setColor(Color.argb(160, Color.red(color), Color.green(color), Color.blue(color)));
                      float tolRadius = Math.min(radius, (float) tolerance * scale);
                      canvas.drawCircle(cx, cy, Math.max(8f, tolRadius), paint);
          
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(Color.argb(70, Color.red(color), Color.green(color), Color.blue(color)));
                      canvas.drawCircle(bx, by, radius * 0.18f, paint);
                      paint.setColor(color);
                      canvas.drawCircle(bx, by, radius * 0.105f, paint);
          
                      paint.setTextAlign(Paint.Align.CENTER);
                      paint.setTypeface(Typeface.DEFAULT_BOLD);
                      paint.setTextSize(30f);
                      paint.setColor(Color.rgb(235, 243, 255));
                      canvas.drawText(String.format(Locale.US, "error máx. %.2f°", errMax), cx, h - 54f, paint);
                      paint.setTypeface(Typeface.DEFAULT);
                      paint.setTextSize(20f);
                      paint.setColor(Color.rgb(144, 161, 188));
                      canvas.drawText(String.format(Locale.US, "L %.2f°→%.2f° · T %.2f°→%.2f°", relLong, targetLong, relTrans, targetTrans), cx, h - 24f, paint);
                  }
          
                  private float clamp(float v, float min, float max) {
                      return Math.max(min, Math.min(max, v));
                  }
              }
          }
          JAVA

      - name: Build debug APK and AAB
        run: gradle :app:assembleDebug :app:bundleDebug --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p app/build/outputs/final
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/final/NivelFV-DaKoNe-PRO-v11.apk
          cp app/build/outputs/bundle/debug/app-debug.aab app/build/outputs/final/NivelFV-DaKoNe-PRO-v11.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: NivelFV-PRO-v11-test
          path: |
            app/build/outputs/final/NivelFV-DaKoNe-PRO-v11.apk
            app/build/outputs/final/NivelFV-DaKoNe-PRO-v11.aab

      - name: Publish Release compartible
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nivelfv-pro-latest -y --cleanup-tag || true
          gh release create nivelfv-pro-latest app/build/outputs/final/NivelFV-DaKoNe-PRO-v11.apk app/build/outputs/final/NivelFV-DaKoNe-PRO-v11.aab --title "Nivel FV PRO DaKoNe" --notes "Versión PRO de prueba: longitudinal + transversal, cámara, CSV y captura PNG." --latest
