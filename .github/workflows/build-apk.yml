              private void safeVibrate() {
                  long now = System.currentTimeMillis();
                  if (now - lastVibration < 2500) return;
                  lastVibration = now;
                  try {
                      Vibrator vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (vibrator != null && vibrator.hasVibrator()) {
                          if (android.os.Build.VERSION.SDK_INT >= 26) {
                              vibrator.vibrate(VibrationEffect.createOneShot(35, VibrationEffect.DEFAULT_AMPLITUDE));
                          } else {
                              vibrator.vibrate(35);
                          }
                      }
                  } catch (Throwable ignored) {}
              }
          
              private double parseDouble(String value, double fallback) {
                  try {
                      return Double.parseDouble(value.replace(',', '.').trim());
                  } catch (Exception e) {
                      return fallback;
                  }
              }
          
              private double slopePercent(double deg) {
                  return Math.tan(Math.toRadians(deg)) * 100.0;
              }
          
              private String statusFor(double error, double tolerance) {
                  if (error <= tolerance) return "OK";
                  if (error <= tolerance * 2.0) return "REVISAR";
                  return "FUERA";
              }
          
              private String fmt(double v) {
                  return String.format(Locale.US, "%+.2f°", v);
              }
          
              private String num(double v) {
                  return String.format(Locale.US, "%.3f", v);
              }
          
              private String csv(String value) {
                  if (value == null) value = "";
                  return "\"" + value.replace("\"", "\"\"") + "\"";
              }
          
              private String textOr(EditText e, String fallback) {
                  String s = e.getText().toString().trim();
                  return s.isEmpty() ? fallback : s;
              }
          
              private float clamp(float v, float min, float max) {
                  return Math.max(min, Math.min(max, v));
              }
          
