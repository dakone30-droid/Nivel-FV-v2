name: Build NivelFV PRO APK v11

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/dakone/nivelfv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'NivelFVPro'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.dakone.nivelfv'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'com.dakone.nivelfv'
                  minSdk 23
                  targetSdk 35
                  versionCode 11
                  versionName '1.0-pro-test'
              }
          }
          GRADLE

          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#050914</item>
                  <item name="android:statusBarColor">#050914</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          XML

          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#050914" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#101A33" android:strokeColor="#39DCFF" android:strokeWidth="4" android:pathData="M18,18h72v72h-72z" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#33FF98" android:strokeWidth="4" android:strokeLineCap="round" android:pathData="M30,54h48M54,30v48" />
              <path android:fillColor="#33FF98" android:pathData="M46,46h16v16h-16z" />
              <path android:fillColor="#EAF3FF" android:pathData="M31,84h46v6h-46z" />
          </vector>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          
              <application
                  android:theme="@style/AppTheme"
                  android:label="Nivel FV Pro"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/dakone/nivelfv/MainActivity.java <<'JAVA'
          package com.dakone.nivelfv;
          
          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.SurfaceTexture;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
